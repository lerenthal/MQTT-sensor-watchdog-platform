mqtt:
  broker: 10.10.17.11
  port: 1883
  username: CHANGE_ME
  password: CHANGE_ME
  topic_subscription: facility/+/env_sensor/#
  keepalive_seconds: 60
  reconnect_min_delay_seconds: 1
  reconnect_max_delay_seconds: 30
telegram:
  enabled: false
  bot_token: YOUR_TELEGRAM_BOT_TOKEN_HERE
  chat_id: YOUR_TELEGRAM_CHAT_ID_HERE
  nagging_interval_seconds: 180
  poll_timeout_seconds: 25
watchdog:
  check_interval_seconds: 30
  default_heartbeat_timeout_seconds: 180
  default_offline_timeout_seconds: 120
  sensor_flatline_seconds: 900
  sensor_flatline_min_change: 0.0
  sensor_flatline_detection_enabled: false
  ignored_devices:
  - spare-1
  - spare-2
  out_of_range_hysteresis_seconds: 60
  # Adaptive staleness. A channel counts as silent only after
  # max(sensor_flatline_seconds, this x its own measured publish interval).
  # The fleet's channels publish on very different cadences; with a single
  # fixed window the slow ones sat permanently on the threshold and flapped
  # in and out of DEGRADED/SYSTEMIC on every cycle. 0 restores the old
  # fixed-window behaviour.
  sensor_stale_interval_multiplier: 3.0
  # A channel the device stops publishing entirely, while the device keeps
  # publishing its other channels normally, is an entity that is not on the
  # device any more (a misnamed sensor from a shared config, flashed once).
  # After this long with no packet at all it is retired: removed from the
  # dashboard and no longer alerted on. A channel that really is broken is
  # caught long before this and reported as SENSOR_SILENT.
  retired_sensor_after_seconds: 21600
  # Retention windows for the history tables. alerts and
  # device_status_history grow with every fault (roughly 75 rows an hour
  # on a flapping fleet), so without a window they grow without bound
  # and the audit trail becomes unreadable.
  #   0 disables the pruning for that table.
  alert_retention_days: 90            # resolved alerts
  status_history_retention_days: 30   # the flap detector's record
  audit_retention_days: 365           # the audit trail itself
  # Clear-side deadband for OUT_OF_RANGE, as a percentage of the configured
  # band (max-min). A value must come back inside the limits by this margin
  # before the breach resolves, so a reading parked on the limit cannot
  # resolve and re-raise on alternating cycles. 0 disables.
  out_of_range_clear_margin_pct: 2.0
  # Alarm tone for the wall board. One of:
  #   chime       - gentle two-note chime; easy to live with, may not carry
  #   warble      - fast alternation; noticeable
  #   siren       - rising/falling two-tone (recommended default)
  #   klaxon      - loud and harsh
  #   continuous  - unbroken tone; most intrusive
  buzzer_style: siren
web:
  host: 0.0.0.0
  port: 5050
  secret_key: CHANGE_ME_generated_on_first_boot
  dashboard_refresh_seconds: 10
auth:
  # These accounts have NO password set. The placeholder below cannot be
  # produced by any password, so this template is safe to publish: a fresh
  # install refuses every login until a real password is set. The working
  # credentials live in config/config.yaml, which is gitignored.
  #
  # To set a password, either edit the live config's auth block, or use
  # the Admin Config page - the YAML editor accepts:
  #     yaniv:
  #       role: admin
  #       password: <the password>
  # and the app upgrades it to a salted hash on the next start.
  users:
    yaniv:
      role: admin
      password_hash:
        salt: ""
        hash: "!"
    operator:
      role: operator
      password_hash:
        salt: ""
        hash: "!"
  config_history_max_versions: 50
facility:
  # app_name is the product name shown in the page header, the browser tab and
  # the wall board. facility.name is the SITE being monitored and appears in
  # the printed report header.
  app_name: PsygaBio Device Watchdog
  # The timezone every timestamp is recorded in. Everything in this system
  # is LOCAL wall-clock: the audit trail has to line up with the device
  # timeline and with the operator's own clock. The app pins this at
  # startup and verifies that SQLite and Python agree, so a container
  # started without TZ cannot silently write UTC.
  timezone: Asia/Jerusalem
  name: Mushroom Cultivation Facility
  location: Israel
  report_title: Device Watchdog Status Report
snooze_presets:
- label: 1 Hour
  hours: 1
- label: 8 Hours
  hours: 8
- label: 24 Hours
  hours: 24
- label: 7 Days
  hours: 168
